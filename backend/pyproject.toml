[project]
name = "rawjudge-api"
version = "0.3.0"
description = "RAW-certified photography review API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "sqlalchemy==2.0.50",
  "pydantic==2.13.4",
  "python-multipart==0.0.22",
  "httpx==0.28.1",
  "pillow==12.1.0"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
postgres = ["psycopg[binary]==3.3.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
