name: Release Beta APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify backend
        run: |
          pip install -e './backend[dev]'
          cd backend
          ruff check .
          ruff format --check .
          pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/rawjudge-bootstrap
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build installable beta APK
        run: ./android/gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Prepare release assets
        env:
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          name="${RELEASE_NAME:-${{ inputs.tag }}}"
          name="${name:-manual}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "RAWJudge-${name}-beta.apk"
          sha256sum "RAWJudge-${name}-beta.apk" > "RAWJudge-${name}-SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            RAWJudge-*-beta.apk
            RAWJudge-*-SHA256SUMS.txt
          generate_release_notes: true
          prerelease: true
