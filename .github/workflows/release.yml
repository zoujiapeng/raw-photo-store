name: Release Beta APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.RAWJUDGE_API_BASE_URL || 'http://10.0.2.2:8000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify backend
        run: |
          pip install -e './backend[dev]'
          cd backend
          pytest -q
          python -m compileall -q app tests
      - name: Build API container
        run: docker build --tag rawjudge-api:release backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build installable beta APK
        run: |
          gradle -p android \
            -PRAWJUDGE_API_BASE_URL="$API_BASE_URL" \
            :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Prepare release assets
        env:
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          name="${RELEASE_NAME:-manual}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "RAWJudge-${name}-beta.apk"
          sha256sum "RAWJudge-${name}-beta.apk" > "RAWJudge-${name}-SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: rawjudge-beta-release
          path: |
            RAWJudge-*-beta.apk
            RAWJudge-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            RAWJudge-*-beta.apk
            RAWJudge-*-SHA256SUMS.txt
          generate_release_notes: true
          prerelease: true
