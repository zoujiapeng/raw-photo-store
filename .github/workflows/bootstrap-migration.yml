name: Bootstrap RAWJudge migration

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part00 .bootstrap/source.part01 .bootstrap/source.part02 | base64 --decode > /tmp/rawjudge-source.tar.xz
          mkdir -p /tmp/rawjudge-source
          tar -xJf /tmp/rawjudge-source.tar.xz -C /tmp/rawjudge-source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/bootstrap-migration.yml' \
            /tmp/rawjudge-source/RAWJudge-0.1.0/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate complete RAWJudge Android and backend project'
          git push origin HEAD:main
