services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////data/rawjudge.db
      UPLOAD_DIR: /uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TOKEN_PEPPER: ${TOKEN_PEPPER:-rawjudge-local-development-pepper}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-26214400}
      MAX_RAW_BYTES: ${MAX_RAW_BYTES:-314572800}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-80000000}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-100}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CONTENT_POLICY_PROFILE: ${CONTENT_POLICY_PROFILE:-global}
    volumes:
      - rawjudge-data:/data
      - rawjudge-uploads:/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  rawjudge-data:
  rawjudge-uploads:
